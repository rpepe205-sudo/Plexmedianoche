name: Comprobar proyecto sin compilar APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'addons/**'
      - 'skin/**'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Instalar lector YAML
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Revisar YAML, shell, Python y XML
        run: python3 scripts/validate_project.py
