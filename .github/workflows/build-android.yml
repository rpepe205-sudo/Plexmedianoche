name: Crear APK de Plex Media Noche

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'
      - 'Plex_de_Media_Noche_0.4.0_KIT.zip'
      - 'skin/**'
      - 'addons/**'

permissions:
  contents: read

jobs:
  build:
    name: Compilar Plex Media Noche para Android ARM32 (armeabi-v7a)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Comprobar ZIP del skin
        run: |
          set -e
          test -f Plex_de_Media_Noche_0.4.0_KIT.zip
          unzip -t Plex_de_Media_Noche_0.4.0_KIT.zip
          test -s skin/1080i/Home.xml

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf bison build-essential curl \
            flex gawk git gperf unzip zip \
            lib32stdc++6 lib32z1 lib32z1-dev \
            libcurl4-openssl-dev zlib1g-dev \
            python3 cmake ninja-build

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Reutilizar la clave de firma de prueba
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: plexmedianoche-debug-keystore-v1

      - name: Instalar herramientas Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"
          yes | sdkmanager --licenses

      - name: Crear clave de depuración Android
        run: |
          set -e
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Descargar Kodi
        run: |
          git clone --depth 1 \
            https://github.com/xbmc/xbmc.git kodi

      - name: Conservar el nombre Kodi y usar identificador propio
        run: |
          set -e
          grep -Fqx 'APP_NAME Kodi' kodi/version.txt
          sed -i 's/^APP_PACKAGE org[.]xbmc[.]kodi$/APP_PACKAGE com.plexmedianoche.kodi/' kodi/version.txt
          grep -Fqx 'APP_PACKAGE com.plexmedianoche.kodi' kodi/version.txt
          echo "Nombre visible: Kodi"
          echo "Identificador privado: com.plexmedianoche.kodi"
      - name: Preparar el skin
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/skin"
          unzip -q Plex_de_Media_Noche_0.4.0_KIT.zip \
            -d "$RUNNER_TEMP/skin"

          ADDON_XML="$(find "$RUNNER_TEMP/skin" \
            -type f -name addon.xml -print -quit)"

          test -n "$ADDON_XML"

          ADDON_ID="$(python3 - "$ADDON_XML" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          addon_id = root.get("id", "")
          if not addon_id.startswith("skin."):
              raise SystemExit("El ZIP no contiene un skin Kodi válido")
          print(addon_id)
          PY
          )"

          mkdir -p kodi/addons
          cp -a "$(dirname "$ADDON_XML")" \
            "kodi/addons/$ADDON_ID"

          # Mantener una copia en el repositorio para que el empaquetado Android la encuentre.
          mkdir -p "$GITHUB_WORKSPACE/addons/$ADDON_ID"
          cp -a "$(dirname "$ADDON_XML")/." "$GITHUB_WORKSPACE/addons/$ADDON_ID/"

          mkdir -p "kodi/addons/$ADDON_ID/1080i"
          cp skin/1080i/Home.xml "kodi/addons/$ADDON_ID/1080i/Home.xml"
          python3 - "$ADDON_XML" "kodi/addons/$ADDON_ID/1080i/Home.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          addon = ET.parse(sys.argv[1]).getroot()
          home = ET.parse(sys.argv[2]).getroot()
          if addon.get("id") != "skin.pepe.plexmedianoche" or home.tag != "window":
              raise SystemExit("El skin o su pantalla inicial no es válido")
          print("Pantalla inicial validada")
          PY

          echo "Skin identificado: $ADDON_ID"

          test "$ADDON_ID" = "skin.pepe.plexmedianoche"
          grep -Fq '<default>skin.estuary</default>' kodi/system/settings/settings.xml
          sed -i 's#<default>skin.estuary</default>#<default>skin.pepe.plexmedianoche</default>#' kodi/system/settings/settings.xml
          grep -Fq '<default>skin.pepe.plexmedianoche</default>' kodi/system/settings/settings.xml
          echo "Skin configurado como pantalla inicial de Kodi"

      - name: Integrar mantenimiento diario y semanal de biblioteca
        run: |
          set -e
          ADDON_ID="service.plexmedianoche.maintenance"
          test -s "addons/$ADDON_ID/addon.xml"
          test -s "addons/$ADDON_ID/service.py"
          mkdir -p "kodi/addons/$ADDON_ID"
          cp -a "addons/$ADDON_ID/." "kodi/addons/$ADDON_ID/"
          python3 - "kodi/addons/$ADDON_ID/addon.xml" "kodi/addons/$ADDON_ID/service.py" <<'PY'
          import ast
          import sys
          import xml.etree.ElementTree as ET
          addon = ET.parse(sys.argv[1]).getroot()
          if addon.get("id") != "service.plexmedianoche.maintenance":
              raise SystemExit("Identificador del servicio inesperado")
          service = addon.find("./extension[@point='xbmc.service']")
          if service is None or service.get("library") != "service.py":
              raise SystemExit("No se encontró el punto de entrada del servicio")
          with open(sys.argv[2], encoding="utf-8") as source:
              ast.parse(source.read(), filename=sys.argv[2])
          print("Servicio de mantenimiento incluido y validado")
          PY

      - name: Asegurar que el skin y el servicio se empaquetan en la APK
        run: |
          set -e
          MAKEFILE="kodi/tools/android/packaging/Makefile.in"
          test -s "$MAKEFILE"
          python3 - "$MAKEFILE" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = path.read_text(encoding="utf-8")
          marker = "\tcp -rfp $(DEPENDS_PATH)/share/kodi/* ./assets || true\n"
          addition = (
              marker
              + "\tmkdir -p ./assets/addons\n"
              + "\tcp -rfp $(CMAKE_SOURCE_DIR)/../addons/skin.pepe.plexmedianoche ./assets/addons/\n"
              + "\tcp -rfp $(CMAKE_SOURCE_DIR)/../addons/service.plexmedianoche.maintenance ./assets/addons/\n"
          )
          if "skin.pepe.plexmedianoche ./assets/addons/" in data:
              print("La regla de empaquetado ya contiene la integración")
          elif marker in data:
              path.write_text(data.replace(marker, addition, 1), encoding="utf-8")
              print("Reglas de empaquetado actualizadas")
          else:
              raise SystemExit("No se encontró el punto de integración del empaquetado Android")
          PY
          grep -Fq 'skin.pepe.plexmedianoche ./assets/addons/' "$MAKEFILE"
          grep -Fq 'service.plexmedianoche.maintenance ./assets/addons/' "$MAKEFILE"

      - name: Preparar dependencias de Kodi
        run: |
          set -e
          cd kodi/tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs="$HOME/android-tools/xbmc-tarballs" \
            --host=arm-linux-androideabi \
            --with-sdk-path="$ANDROID_SDK_ROOT" \
            --prefix="$HOME/android-tools/xbmc-depends"
          make -j2

      - name: Generar sistema de compilación
        run: |
          set -e
          cd kodi
          make -C tools/depends/target/cmakebuildsys \
            BUILD_DIR="$GITHUB_WORKSPACE/kodi-build" \
            CMAKE_EXTRA_ARGUMENTS="-DENABLE_INTERNAL_BLURAY=OFF -DENABLE_INTERNAL_UDFREAD=OFF"

      - name: Compilar Kodi
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kodi-build"
          make -j2

      - name: Crear APK Android
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kodi-build"
          make apk

      - name: Localizar APK
        run: |
          set -e
          mkdir -p dist
          APK="$(find "$GITHUB_WORKSPACE/kodi" \
            -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No se ha encontrado ninguna APK"
            exit 1
          fi
          cp "$APK" dist/Plex-Media-Noche-arm32.apk
          echo "Comprobando que el skin y el servicio están dentro de la APK..."
          unzip -l dist/Plex-Media-Noche-arm32.apk | grep -F 'assets/addons/skin.pepe.plexmedianoche/addon.xml'
          unzip -l dist/Plex-Media-Noche-arm32.apk | grep -F 'assets/addons/skin.pepe.plexmedianoche/1080i/Home.xml'
          unzip -l dist/Plex-Media-Noche-arm32.apk | grep -F 'assets/addons/service.plexmedianoche.maintenance/addon.xml'
          ls -lh dist/

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Plex-Media-Noche-APK-arm32
          path: dist/Plex-Media-Noche-arm32.apk
          if-no-files-found: error
          retention-days: 7
