name: Crear APK de Plex Media Noche

# Solo ejecución manual: evita compilaciones automáticas en cada cambio.
on:
  workflow_dispatch:
  # Ejecutar una nueva prueba cuando se corrija este workflow en main.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'

concurrency:
  group: plexmedianoche-android-build
  # No cancelar una compilación larga por un ajuste posterior del workflow.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Compilar Plex Media Noche para Android ARM32 (armeabi-v7a)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Comprobar ZIP del skin
        run: |
          set -e
          test -f Plex_de_Media_Noche_0.4.0_KIT.zip
          unzip -t Plex_de_Media_Noche_0.4.0_KIT.zip
          test -s skin/1080i/Home.xml

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf bison build-essential curl \
            flex gawk git gperf unzip zip \
            lib32stdc++6 lib32z1 lib32z1-dev \
            libcurl4-openssl-dev zlib1g-dev \
            python3 python3-pil cmake ninja-build

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Reutilizar la clave de firma de prueba
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: plexmedianoche-debug-keystore-v1

      - name: Instalar herramientas Android (con reintentos)
        run: |
          set -euo pipefail
          # Aceptar licencias antes de instalar los paquetes.
          yes | sdkmanager --licenses || true

          # GitHub puede interrumpir una descarga grande del NDK; eliminar
          # cualquier descarga/carpeta parcial y reintentar desde cero.
          for attempt in 1 2 3; do
            echo "Intento $attempt de 3 para instalar el NDK y las herramientas Android"
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358" "$HOME/.android/cache"
            if sdkmanager --install \
              "platform-tools" \
              "platforms;android-37.0" \
              "build-tools;37.0.0" \
              "ndk;28.2.13676358"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::No se pudieron instalar las herramientas Android después de 3 intentos"
              exit 1
            fi
            sleep 10
          done

          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt"

      - name: Crear clave de depuración Android
        run: |
          set -e
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Descargar Kodi
        run: |
          git clone --depth 1 \
            https://github.com/xbmc/xbmc.git kodi

      - name: Evitar símbolos TLS sin enlazar en libmicrohttpd Android
        run: |
          set -e
          FILE="kodi/tools/depends/target/libmicrohttpd/Makefile"
          test -s "$FILE"
          python3 - "$FILE" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = path.read_text(encoding="utf-8")
          old = "                      --enable-https"
          new = "                      --disable-https"
          if new in data:
              print("HTTPS opcional de libmicrohttpd ya está desactivado para este APK Android")
          elif old in data:
              data = data.replace(old, new, 1)
              path.write_text(data, encoding="utf-8")
              print("Desactivado HTTPS opcional en libmicrohttpd para evitar referencias GnuTLS/Nettle sin enlazar")
          else:
              raise SystemExit("No se encontró la opción HTTPS esperada en Makefile de libmicrohttpd")
          PY
          grep -Fq -- '--disable-https' "$FILE"
          ! grep -Fq -- '--enable-https' "$FILE"

      - name: Conservar el nombre Kodi y usar identificador propio
        run: |
          set -e
          grep -Fqx 'APP_NAME Kodi' kodi/version.txt
          sed -i 's/^APP_PACKAGE org[.]xbmc[.]kodi$/APP_PACKAGE com.plexmedianoche.kodi/' kodi/version.txt
          grep -Fqx 'APP_PACKAGE com.plexmedianoche.kodi' kodi/version.txt
          # Evitar que un nombre de marca con espacios contamine los nombres internos de objetivos CMake.
          python3 - kodi/CMakeLists.txt <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = path.read_text(encoding="utf-8")
          marker = "add_custom_target(${APP_NAME_LC}-libraries)"
          fix = "set(APP_NAME_LC kodi) # Nombre interno seguro para CMake\n" + marker
          if "set(APP_NAME_LC kodi) # Nombre interno seguro para CMake" not in data:
              if marker not in data:
                  raise SystemExit("No se encontró el objetivo de bibliotecas de Kodi para corregir el nombre interno")
              data = data.replace(marker, fix, 1)
              path.write_text(data, encoding="utf-8")
          print("Nombre interno CMake fijado a kodi")
          PY
          grep -Fq 'set(APP_NAME_LC kodi) # Nombre interno seguro para CMake' kodi/CMakeLists.txt
          # Evitar que la configuración falle si Kodi no ha creado el objetivo global de bibliotecas.
          python3 - kodi/cmake/scripts/linux/Macros.cmake <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = path.read_text(encoding="utf-8")
          old = "  add_dependencies(${APP_NAME_LC}-libraries wrap_${libname})"
          new = (
              "  if(TARGET ${APP_NAME_LC}-libraries)\n"
              "    add_dependencies(${APP_NAME_LC}-libraries wrap_${libname})\n"
              "  endif()"
          )
          if new not in data:
              if old not in data:
                  raise SystemExit("No se encontró la dependencia de bibliotecas en Macros.cmake")
              data = data.replace(old, new, 1)
              path.write_text(data, encoding="utf-8")
          print("Dependencia de bibliotecas protegida")
          PY
          grep -Fq 'if(TARGET ${APP_NAME_LC}-libraries)' kodi/cmake/scripts/linux/Macros.cmake
          echo "Nombre visible: Kodi"
          echo "Identificador privado: com.plexmedianoche.kodi"
      - name: Preparar el skin
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/skin"
          unzip -q Plex_de_Media_Noche_0.4.0_KIT.zip \
            -d "$RUNNER_TEMP/skin"

          ADDON_XML="$(find "$RUNNER_TEMP/skin" \
            -type f -name addon.xml -print -quit)"

          test -n "$ADDON_XML"

          ADDON_ID="$(python3 - "$ADDON_XML" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          addon_id = root.get("id", "")
          if not addon_id.startswith("skin."):
              raise SystemExit("El ZIP no contiene un skin Kodi válido")
          print(addon_id)
          PY
          )"

          mkdir -p kodi/addons
          cp -a "$(dirname "$ADDON_XML")" \
            "kodi/addons/$ADDON_ID"

          # Mantener una copia en el repositorio para que el empaquetado Android la encuentre.
          mkdir -p "$GITHUB_WORKSPACE/addons/$ADDON_ID"
          cp -a "$(dirname "$ADDON_XML")/." "$GITHUB_WORKSPACE/addons/$ADDON_ID/"

          mkdir -p "kodi/addons/$ADDON_ID/1080i"
          cp skin/1080i/Home.xml "kodi/addons/$ADDON_ID/1080i/Home.xml"
          # El empaquetado Android toma el skin desde $GITHUB_WORKSPACE/addons,
          # así que hay que copiar también allí la pantalla de inicio personalizada.
          mkdir -p "$GITHUB_WORKSPACE/addons/$ADDON_ID/1080i"
          cp skin/1080i/Home.xml "$GITHUB_WORKSPACE/addons/$ADDON_ID/1080i/Home.xml"
          test -s "$GITHUB_WORKSPACE/addons/$ADDON_ID/1080i/Home.xml" || { echo "ERROR: no se ha copiado Home.xml al directorio de empaquetado"; exit 1; }
          echo "Copia de Home.xml preparada para el empaquetado Android"
          python3 - "$ADDON_XML" "kodi/addons/$ADDON_ID/1080i/Home.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          addon = ET.parse(sys.argv[1]).getroot()
          home = ET.parse(sys.argv[2]).getroot()
          if addon.get("id") != "skin.pepe.plexmedianoche" or home.tag != "window":
              raise SystemExit("El skin o su pantalla inicial no es válido")
          print("Pantalla inicial validada")
          PY

          echo "Skin identificado: $ADDON_ID"

          test "$ADDON_ID" = "skin.pepe.plexmedianoche"
          grep -Fq '<default>skin.estuary</default>' kodi/system/settings/settings.xml
          sed -i 's#<default>skin.estuary</default>#<default>skin.pepe.plexmedianoche</default>#' kodi/system/settings/settings.xml
          grep -Fq '<default>skin.pepe.plexmedianoche</default>' kodi/system/settings/settings.xml
          echo "Skin configurado como pantalla inicial de Kodi"

      - name: Generar texturas del skin Plex de Media Noche
        run: |
          set -e
          MEDIA_DIR="$GITHUB_WORKSPACE/addons/skin.pepe.plexmedianoche/media"
          mkdir -p "$MEDIA_DIR"
          python3 - "$MEDIA_DIR" <<'PY'
          from PIL import Image, ImageDraw, ImageFilter, ImageFont
          import math, os, sys
          out = sys.argv[1]
          os.makedirs(out, exist_ok=True)

          # Fondo cinematográfico 16:9 en azul medianoche, con luz azul y dorada.
          w, h = 1920, 1080
          bg = Image.new("RGB", (w, h))
          px = bg.load()
          for y in range(h):
              for x in range(w):
                  glow = max(0.0, 1.0 - math.sqrt(((x-1370)/1050)**2 + ((y-300)/760)**2))
                  blue = max(0.0, 1.0 - math.sqrt(((x-350)/850)**2 + ((y-620)/720)**2))
                  px[x,y] = (int(5 + 7*glow), int(11 + 15*glow + 4*blue), int(23 + 27*glow + 25*blue))
          bg = bg.convert("RGBA")
          glow = Image.new("RGBA", (w,h), (0,0,0,0))
          gd = ImageDraw.Draw(glow)
          gd.ellipse((920,-250,1960,720), fill=(27,106,174,46))
          gd.ellipse((-350,360,760,1360), fill=(18,66,116,34))
          glow = glow.filter(ImageFilter.GaussianBlur(100))
          bg = Image.alpha_composite(bg, glow)
          d = ImageDraw.Draw(bg)
          # Horizonte y silueta urbana discreta para dar profundidad sin competir con carátulas.
          skyline = [(0,850),(85,850),(85,760),(125,760),(125,815),(190,815),(190,700),(245,700),(245,835),(315,835),(315,780),(360,780),(360,730),(405,730),(405,840),(490,840),(490,690),(550,690),(550,820),(625,820),(625,750),(680,750),(680,855),(780,855),(780,790),(830,790),(830,850),(960,850),(960,720),(1015,720),(1015,835),(1100,835),(1100,760),(1150,760),(1150,850),(1280,850),(1280,680),(1340,680),(1340,830),(1430,830),(1430,755),(1495,755),(1495,850),(1600,850),(1600,720),(1660,720),(1660,835),(1740,835),(1740,775),(1800,775),(1800,850),(1920,850),(1920,1080),(0,1080)]
          d.polygon(skyline, fill=(4,8,16,150))
          d.line((0,852,1920,852), fill=(213,165,74,125), width=2)
          # Filetes finos dorado/azul.
          d.line((48,930,1872,930), fill=(67,139,202,70), width=2)
          d.line((48,934,670,934), fill=(237,188,91,120), width=2)
          bg.convert("RGB").save(os.path.join(out,"background.jpg"), quality=91, optimize=True)

          # Panel translúcido para superponer texto y botones.
          panel = Image.new("RGBA",(512,256),(5,12,24,225))
          pd = ImageDraw.Draw(panel)
          pd.rectangle((1,1,510,254), outline=(61,112,159,180), width=2)
          pd.line((2,2,180,2), fill=(244,190,86,230), width=3)
          pd.line((2,253,510,253), fill=(41,101,153,110), width=1)
          panel.save(os.path.join(out,"panel.png"), optimize=True)

          labels = ["FAVORITOS","ESTRENOS SERIES","SERIES","CINE","ESTRENOS CINE","TV","AJUSTES","SALIR"]
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 25)
          except OSError:
              font = ImageFont.load_default()
          for i, label in enumerate(labels):
              tile = Image.new("RGB",(640,180),(6,14,28))
              td = ImageDraw.Draw(tile)
              # bandas diagonales azul noche y reflejo dorado.
              td.polygon([(0,0),(270,0),(150,180),(0,180)], fill=(9,27,49))
              td.polygon([(430,0),(640,0),(640,180),(535,180)], fill=(10,36,60))
              td.line((0,174,640,174), fill=(47,110,162), width=2)
              td.line((0,170,180,170), fill=(239,188,91), width=3)
              td.ellipse((470,-85,665,110), outline=(63,132,184), width=3)
              td.ellipse((493,-62,640,85), outline=(210,166,85), width=1)
              bbox=td.textbbox((0,0),label,font=font)
              tw=bbox[2]-bbox[0]
              td.text(((640-tw)//2,70),label,font=font,fill=(244,247,252))
              tile.save(os.path.join(out,f"tile_{i}.jpg"),quality=90,optimize=True)
          print("Texturas generadas:", ", ".join(sorted(os.listdir(out))))
          PY
          mkdir -p "$GITHUB_WORKSPACE/kodi/addons/skin.pepe.plexmedianoche/media"
          cp -a "$MEDIA_DIR/." "$GITHUB_WORKSPACE/kodi/addons/skin.pepe.plexmedianoche/media/"
          test -s "$MEDIA_DIR/background.jpg"
          test -s "$MEDIA_DIR/panel.png"
          test -s "$MEDIA_DIR/tile_7.jpg"

      - name: Integrar mantenimiento diario y semanal de biblioteca
        run: |
          set -e
          ADDON_ID="service.plexmedianoche.maintenance"
          test -s "addons/$ADDON_ID/addon.xml"
          test -s "addons/$ADDON_ID/service.py"
          mkdir -p "kodi/addons/$ADDON_ID"
          cp -a "addons/$ADDON_ID/." "kodi/addons/$ADDON_ID/"
          python3 - "kodi/addons/$ADDON_ID/addon.xml" "kodi/addons/$ADDON_ID/service.py" <<'PY'
          import ast
          import sys
          import xml.etree.ElementTree as ET
          addon = ET.parse(sys.argv[1]).getroot()
          if addon.get("id") != "service.plexmedianoche.maintenance":
              raise SystemExit("Identificador del servicio inesperado")
          service = addon.find("./extension[@point='xbmc.service']")
          if service is None or service.get("library") != "service.py":
              raise SystemExit("No se encontró el punto de entrada del servicio")
          with open(sys.argv[2], encoding="utf-8") as source:
              ast.parse(source.read(), filename=sys.argv[2])
          print("Servicio de mantenimiento incluido y validado")
          PY

      - name: Asegurar que el skin y el servicio se empaquetan en la APK
        run: |
          set -e
          MAKEFILE="kodi/tools/android/packaging/Makefile.in"
          test -s "$MAKEFILE"
          python3 - "$MAKEFILE" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = path.read_text(encoding="utf-8")
          marker = "\tcp -rfp $(DEPENDS_PATH)/share/kodi/* ./assets || true\n"
          addition = (
              marker
              + "\tmkdir -p ./assets/addons\n"
              + "\tcp -rfp $$GITHUB_WORKSPACE/addons/skin.pepe.plexmedianoche ./assets/addons/\n"
              + "\tmkdir -p ./assets/addons/skin.pepe.plexmedianoche/media\n"
              + "\tcp -rfp $$GITHUB_WORKSPACE/addons/skin.pepe.plexmedianoche/media/. ./assets/addons/skin.pepe.plexmedianoche/media/\n"
              + "\ttest -s ./assets/addons/skin.pepe.plexmedianoche/media/background.jpg\n"
              + "\ttest -s ./assets/addons/skin.pepe.plexmedianoche/media/panel.png\n"
              + "\ttest -s ./assets/addons/skin.pepe.plexmedianoche/media/tile_7.jpg\n"
              + "\tcp -rfp $$GITHUB_WORKSPACE/addons/service.plexmedianoche.maintenance ./assets/addons/\n"
          )
          media_copy = "cp -rfp $$GITHUB_WORKSPACE/addons/skin.pepe.plexmedianoche/media/."
          if media_copy in data:
              print("La regla de empaquetado ya copia las texturas del skin")
          elif marker in data:
              old_integration = (
                  marker
                  + "\tmkdir -p ./assets/addons\n"
                  + "\tcp -rfp $$GITHUB_WORKSPACE/addons/skin.pepe.plexmedianoche ./assets/addons/\n"
                  + "\tcp -rfp $$GITHUB_WORKSPACE/addons/service.plexmedianoche.maintenance ./assets/addons/\n"
              )
              if old_integration in data:
                  data = data.replace(old_integration, addition, 1)
              else:
                  data = data.replace(marker, addition, 1)
              path.write_text(data, encoding="utf-8")
              print("Reglas de empaquetado actualizadas para copiar las texturas del skin")
          else:
              raise SystemExit("No se encontró el punto de integración del empaquetado Android")
          PY
          # Kodi elimina por defecto las imágenes sueltas de media; conservar las del skin propio.
          python3 - "$MAKEFILE" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = path.read_text(encoding="utf-8")
          old = '\tfind `pwd`/assets/addons/skin.*/media/* -depth -not -iname "*.xbt" -exec rm -rf {} \\;\n'
          new = '\tfind `pwd`/assets/addons/skin.*/media/* -depth -not -iname "*.xbt" ! -path "`pwd`/assets/addons/skin.pepe.plexmedianoche/media/*" -exec rm -rf {} \\;\n'
          if new in data:
              print("La limpieza ya conserva las texturas de Plex Media Noche")
          elif old in data:
              data = data.replace(old, new, 1)
              path.write_text(data, encoding="utf-8")
              print("Regla de limpieza ajustada para conservar las texturas propias")
          else:
              raise SystemExit("No se encontró la regla de limpieza de texturas de Kodi; no se puede garantizar el empaquetado")
          PY
          grep -Fq 'skin.pepe.plexmedianoche ./assets/addons/' "$MAKEFILE"
          grep -Fq 'service.plexmedianoche.maintenance ./assets/addons/' "$MAKEFILE"

      - name: Cachear descargas y dependencias compiladas de Kodi
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/android-tools/xbmc-tarballs
            ~/android-tools/xbmc-depends
            kodi/tools/depends/build
          # v5 fuerza una reconstrucción limpia de dependencias para evitar la biblioteca libmicrohttpd antigua con referencias TLS/GnuTLS.
          key: kodi-depends-arm32-tls-off-v5-${{ runner.os }}-${{ hashFiles('Plex_de_Media_Noche_0.4.0_KIT.zip') }}
          restore-keys: |
            kodi-depends-arm32-tls-off-v5-${{ runner.os }}-

      - name: Preparar dependencias de Kodi
        run: |
          set -e
          cd kodi/tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs="$HOME/android-tools/xbmc-tarballs" \
            --host=arm-linux-androideabi \
            --with-sdk-path="$ANDROID_SDK_ROOT" \
            --prefix="$HOME/android-tools/xbmc-depends"
          make -j"$(nproc)"

      # Guardar las dependencias en cuanto esta fase termina; así un fallo
      # posterior al compilar Kodi no obliga a reconstruirlas desde cero.
      - name: Guardar dependencias compiladas de Kodi
        uses: actions/cache/save@v4
        with:
          path: |
            ~/android-tools/xbmc-tarballs
            ~/android-tools/xbmc-depends
            kodi/tools/depends/build
          key: kodi-depends-arm32-tls-off-v5-${{ runner.os }}-${{ hashFiles('Plex_de_Media_Noche_0.4.0_KIT.zip') }}

      - name: Generar sistema de compilación
        run: |
          set -e
          cd kodi
          make -C tools/depends/target/cmakebuildsys \
            BUILD_DIR="$GITHUB_WORKSPACE/kodi-build" \
            CMAKE_EXTRA_ARGUMENTS="-DENABLE_INTERNAL_BLURAY=OFF -DENABLE_INTERNAL_UDFREAD=OFF -DENABLE_SMBCLIENT=OFF"

      - name: Compilar Kodi
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kodi-build"
          make -j"$(nproc)"

      - name: Crear APK Android
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kodi-build"
          make apk

      - name: Localizar APK
        run: |
          set -e
          mkdir -p dist
          APK="$(find "$GITHUB_WORKSPACE/kodi" \
            -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No se ha encontrado ninguna APK"
            exit 1
          fi
          cp "$APK" dist/Plex-Media-Noche-arm32.apk
          echo "Comprobando que el skin y el servicio están dentro de la APK..."
          unzip -l dist/Plex-Media-Noche-arm32.apk | grep -F 'assets/addons/skin.pepe.plexmedianoche/addon.xml'
          unzip -l dist/Plex-Media-Noche-arm32.apk | grep -F 'assets/addons/skin.pepe.plexmedianoche/1080i/Home.xml'
          unzip -l dist/Plex-Media-Noche-arm32.apk | grep -F 'assets/addons/service.plexmedianoche.maintenance/addon.xml'
          unzip -l dist/Plex-Media-Noche-arm32.apk | grep -F 'assets/addons/skin.pepe.plexmedianoche/media/background.jpg'
          unzip -l dist/Plex-Media-Noche-arm32.apk | grep -F 'assets/addons/skin.pepe.plexmedianoche/media/panel.png'
          unzip -l dist/Plex-Media-Noche-arm32.apk | grep -F 'assets/addons/skin.pepe.plexmedianoche/media/tile_7.jpg'
          echo "APK base validada: skin, texturas y servicio de mantenimiento comprobados."
          ls -lh dist/

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Plex-Media-Noche-APK-arm32
          path: dist/Plex-Media-Noche-arm32.apk
          if-no-files-found: error
          retention-days: 7
