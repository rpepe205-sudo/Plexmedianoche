name: Crear ZIP instalable de Plex Media Noche (Kodi Omega)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-skin-omega.yml'
      - 'skin/shortcuts/**'
      - 'skin/colors/**'
      - 'skin/playlists/**'
      - 'scripts/prepare_skin.py'
      - 'scripts/test_video_info.py'
      - 'scripts/test_favourites.py'
      - 'skin/extras/**'
      - 'docs/INSTALAR_Y_PROBAR.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-skin-omega.yml'
      - 'skin/1080i/Home.xml'
      - 'skin/shortcuts/**'
      - 'skin/colors/**'
      - 'skin/playlists/**'
      - 'scripts/prepare_skin.py'
      - 'scripts/test_video_info.py'
      - 'scripts/test_favourites.py'
      - 'skin/extras/**'
      - 'docs/INSTALAR_Y_PROBAR.md'
      - 'docs/PLAN_SKIN_EXISTENTE.md'
      - 'README.md'

permissions:
  contents: read

env:
  ARCTIC_SHA: 27b7bd7f31b8f111a8adfb21f9bbdce835ac3e51

jobs:
  build-skin:
    name: Preparar skin para Kodi 21.1 Omega
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Descargar el proyecto Plex Media Noche
        uses: actions/checkout@v4

      - name: Descargar y conservar Arctic Zephyr Reloaded original
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/beatmasterRS/skin.arctic.zephyr.mod/archive/${ARCTIC_SHA}.zip" \
            -o upstream.zip
          unzip -t upstream.zip
          mkdir upstream
          unzip -q upstream.zip -d upstream
          BASE="$(find upstream -type f -name addon.xml -print -quit)"
          test -n "$BASE"
          mkdir -p work
          cp -a "$(dirname "$BASE")" work/skin.arctic.zephyr.mod

      - name: Comprobar ciclo de favoritos y errores de la API local
        run: python3 scripts/test_favourites.py

      - name: Comprobar regresiones de fichas contra el upstream fijado
        run: python3 scripts/test_video_info.py work/skin.arctic.zephyr.mod/1080i

      - name: Aplicar diseño nocturno y validar personalización
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 scripts/prepare_skin.py work/skin.arctic.zephyr.mod --report dist/validacion-skin.json

      - name: Renombrar carpeta del addon y validar estructura de instalación
        run: |
          set -euo pipefail
          mv work/skin.arctic.zephyr.mod work/skin.plexmedianoche

      - name: Validar y empaquetar skin personalizado
        run: |
          set -euo pipefail
          mkdir -p dist
          cd work
          zip -qr ../dist/PlexMediaNoche-skin-Omega.zip skin.plexmedianoche
          cd ..
          unzip -t dist/PlexMediaNoche-skin-Omega.zip
          ls -lh dist/PlexMediaNoche-skin-Omega.zip
          cp docs/INSTALAR_Y_PROBAR.md dist/LEEME-INSTALACION.md
          printf '%s\n' "$ARCTIC_SHA" > dist/arctic-source-sha.txt
          cd dist
          sha256sum PlexMediaNoche-skin-Omega.zip > SHA256SUMS.txt

      - name: Publicar ZIP instalable
        uses: actions/upload-artifact@v4
        with:
          name: Plex-Media-Noche-skin-Kodi-21-Omega
          path: dist/
          if-no-files-found: error
          retention-days: 14


