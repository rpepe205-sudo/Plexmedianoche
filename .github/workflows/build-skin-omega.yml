name: Crear ZIP instalable de Plex Media Noche (Kodi Omega)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'skin/shortcuts/**', '.github/workflows/build-skin-omega.yml']
  pull_request:
    paths: ['scripts/**', 'skin/shortcuts/**', '.github/workflows/**']

permissions:
  contents: read

jobs:
  build-skin:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Descargar base Arctic fijada a un commit
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/beatmasterRS/skin.arctic.zephyr.mod/archive/27b7bd7f31b8f111a8adfb21f9bbdce835ac3e51.zip -o upstream.zip
          unzip -q upstream.zip -d upstream
      - name: Validar y empaquetar el skin real
        run: python3 scripts/build_skin.py --source upstream/skin.arctic.zephyr.mod-27b7bd7f31b8f111a8adfb21f9bbdce835ac3e51 --output dist --photo
      - uses: actions/upload-artifact@v4
        with:
          name: Plex-Media-Noche-skin-Kodi-21-Omega
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
