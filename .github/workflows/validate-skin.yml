name: Validar maqueta experimental de Plex Media Noche

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-skin.yml'
      - 'Plex_de_Media_Noche_0.4.0_KIT.zip'
      - 'skin/**'
      - 'addons/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validar maqueta y preparar ZIP experimental
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip python3

      - name: Extraer el paquete del proyecto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/skin output

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*KIT.zip' \
            -not -path './work/*' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' \
              -not -path './work/*' -print -quit)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No se encontró el ZIP del proyecto."
            exit 1
          fi

          echo "Comprobando: $ZIP_FILE"
          unzip -t "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d work/skin
          ADDON_XML="$(find work/skin -name addon.xml -type f -print -quit)"
          if [ -z "$ADDON_XML" ]; then
            echo "::error::No se encontró addon.xml."
            exit 1
          fi
          ADDON_DIR="$(dirname "$ADDON_XML")"
          mkdir -p "$ADDON_DIR/1080i"
          cp skin/1080i/Home.xml "$ADDON_DIR/1080i/Home.xml"
          find work/skin -maxdepth 3 -type f | head -n 100

      - name: Validar XML del skin
        run: |
          python3 - <<'PY'
          import ast
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          files = list(pathlib.Path("work/skin").rglob("*.xml"))
          errors = []
          for file in files:
              try:
                  ET.parse(file)
              except Exception as exc:
                  errors.append(f"{file}: {exc}")

          print(f"Archivos XML comprobados: {len(files)}")
          if not files:
              print("::error::No se encontraron archivos XML.")
              sys.exit(1)
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          home = pathlib.Path("skin/1080i/Home.xml")
          root = ET.parse(home).getroot()
          panels = {node.get("id") for node in root.findall(".//control[@type='panel']")}
          required_panels = {"9100", "9200", "9300", "9400"}
          if not required_panels.issubset(panels):
              print("::error::Faltan filas de series, cine o novedades en Home.xml.")
              sys.exit(1)

          addon_dir = pathlib.Path("addons/service.plexmedianoche.maintenance")
          addon_xml = ET.parse(addon_dir / "addon.xml").getroot()
          if addon_xml.get("id") != "service.plexmedianoche.maintenance":
              print("::error::El identificador del servicio no coincide.")
              sys.exit(1)
          entry = addon_xml.find("./extension[@point='xbmc.service']")
          if entry is None or entry.get("library") != "service.py":
              print("::error::No se encontró el punto de entrada del servicio.")
              sys.exit(1)
          source = (addon_dir / "service.py").read_text(encoding="utf-8")
          ast.parse(source, filename=str(addon_dir / "service.py"))
          if "UpdateLibrary(video)" not in source or "today.isoweekday() == 2" not in source:
              print("::error::Falta la actualización diaria o semanal.")
              sys.exit(1)

          print("La pantalla incluye las cuatro filas de biblioteca.")
          print("El servicio diario y de los martes pasó el análisis estático.")
          print("La validación XML terminó correctamente.")
          PY

      - name: Crear ZIP experimental de la maqueta
        shell: bash
        run: |
          set -euo pipefail
          ADDON="$(find work/skin -name addon.xml -type f -print -quit)"
          if [ -z "$ADDON" ]; then
            echo "::error::No se encontró addon.xml."
            exit 1
          fi

          DIR="$(dirname "$ADDON")"
          ADDON_DIR="$(basename "$DIR")"
          cd "$DIR/.."
          zip -qr "$GITHUB_WORKSPACE/output/PlexMediaNoche-skin.zip" "$ADDON_DIR"
          test -s "$GITHUB_WORKSPACE/output/PlexMediaNoche-skin.zip"
          echo "ZIP experimental creado; no acredita instalación ni navegación en Kodi."

      - name: Conservar maqueta experimental
        uses: actions/upload-artifact@v4
        with:
          name: Plex-Media-Noche-maqueta-experimental
          path: output/PlexMediaNoche-skin.zip
          if-no-files-found: error
          retention-days: 14

