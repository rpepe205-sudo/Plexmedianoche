name: Validar referencias heredadas (sin publicar paquetes)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar XML y sintaxis Python de referencias antiguas
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in [*Path('skin').rglob('*.xml'), *Path('addons').rglob('*.xml')]:
              ET.parse(path)
          for path in Path('addons').rglob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'))
          print('Solo referencias antiguas. El paquete real lo genera build-skin-omega.yml.')
          PY
